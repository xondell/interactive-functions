<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f0"><meta name="description" content="Функции и их графики. Интерактивная презентация для 9 класса, 15 слайдов."><title>Функции · интерактивный урок · 9 класс</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main id="app">
 <div id="scene" aria-hidden="true"><svg id="graph" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"></svg></div>
 <div class="topline"><div class="brand">ФУНКЦИИ <span>/ 9 КЛАСС</span></div><div class="topright"><span id="sectionTag">НАЧАЛО УРОКА</span><span id="timeTag">03 МИН</span><button class="utility" id="notesBtn" title="Заметки выступающего (N)">N · заметки</button><button class="utility" id="fsBtn" title="Полный экран (F)">⛶</button></div></div>
 <section class="panel" id="panel"><div class="kicker" id="kicker">01 / ВВЕДЕНИЕ</div><h1 id="headline">Один аргумент.<br><em>Мир функций.</em></h1><div id="description"></div><div class="math-formula" id="formula"></div><div class="controls" id="controls"></div><div class="insight" id="insight"></div><button id="collapse" class="collapse" title="Свернуть текст (T)">← Скрыть текст</button></section>
 <button id="expand" class="expand hidden" title="Показать текст (T)">→ Показать текст</button>
 <div id="graphHint" class="graphhint">Изменяй параметры — график обновится</div>
 <div class="bottom"><button id="prev" aria-label="Предыдущий слайд">←</button><span id="counter">01 / 15</span><div id="progress" class="progress"></div><button id="next" aria-label="Следующий слайд">→</button><button id="menuBtn" class="menu">Все слайды</button></div>
 <dialog id="notesDlg"><div class="dialogHead"><span>ЗАМЕТКИ ПРЕПОДАВАТЕЛЯ · <b id="notesNum"></b></span><button id="closeNotes">✕</button></div><div class="dialogContent"><h2 id="notesTitle"></h2><div id="notesText"></div></div></dialog>
 <dialog id="menuDlg"><div class="dialogHead"><span>СОДЕРЖАНИЕ · 9 КЛАСС</span><button id="closeMenu">✕</button></div><div class="slideMenu" id="slideMenu"></div></dialog>
</main><script src="app.js"></script></body></html>
